<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CampusBite · Prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#F86C0F; --orange-ink:#B84800; --orange-soft:#FFE3CF;
  --ink:#222220; --cream:#F8F0E8; --sand:#F0E4D6; --paper:#FFFBF6;
  --green:#4A6F42; --green-soft:#DFE9D6; --gold:#E3A92B; --red:#B3261E;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--body);background:var(--ink);color:var(--ink);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:-.02em;line-height:1.05}
svg{display:block;flex:none}

/* ---------- Escenario ---------- */
.stage{height:100dvh;display:grid;grid-template-columns:320px auto;justify-content:center;gap:28px;padding:20px 24px;align-items:center}
.phones{display:flex;gap:24px;justify-content:center}
.slot{display:flex;flex-direction:column;gap:10px;align-items:center}
.slot>.who{font-family:var(--display);font-weight:700;color:var(--cream);font-size:14px;display:flex;gap:8px;align-items:center}
.who i{width:8px;height:8px;border-radius:50%;background:var(--orange)}
.slot.rr .who i{background:#A9D18E}

.panel{height:min(860px,100%);display:flex;flex-direction:column;gap:16px;color:var(--cream);min-height:0}
.brand{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.03em}
.brand b{color:var(--orange);font-weight:800}
.tag{font-size:15px;color:#CFC8BC;margin-top:6px}
.nexts{background:var(--orange);color:var(--ink);border-radius:18px;padding:14px 16px}
.nexts small{display:block;font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
.nexts p{font-weight:600;line-height:1.3}
.h-sm{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#A9A398;margin-bottom:8px}
.rf{display:flex;gap:9px;align-items:center;font-size:13.5px;padding:4px 0;color:#A9A398}
.rf .box{width:18px;height:18px;border-radius:6px;border:1.5px solid #5a5850;display:grid;place-items:center;flex:none}
.rf.on{color:var(--cream)}
.rf.on .box{background:#A9D18E;border-color:#A9D18E;color:var(--ink)}
.logwrap{flex:1;min-height:0;display:flex;flex-direction:column}
.log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:9px;font-size:12.5px;scrollbar-width:thin;scrollbar-color:#4a4943 transparent}
.log div{display:grid;grid-template-columns:58px 1fr;gap:6px;color:#D8D1C5}
.log em{font-style:normal;font-weight:700;font-size:10px;letter-spacing:.05em;padding-top:2px;color:#F9A56E}
.log em.b{color:#A9D18E}.log em.d{color:#CDBBEA}
.reset{align-self:flex-start;font-weight:600;font-size:13px;color:var(--cream);border:1.5px solid #5a5850;padding:7px 14px;border-radius:99px}
.reset:hover{border-color:var(--cream)}

.topbar{display:none}
/* ---------- Teléfono ---------- */
.phone{--bg:var(--cream);--card:var(--paper);--tx:var(--ink);--mut:#67645C;--line:#E6D9CA;--accent-tx:var(--orange-ink);--ok:var(--green);--ok-soft:var(--green-soft);--c:var(--green);
  position:relative;width:375px;height:min(800px,calc(100dvh - 72px));border-radius:42px;background:var(--bg);color:var(--tx);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 0 9px #0f0f0e,0 0 0 10px #3b3a36}
.phone.dark{--bg:#191917;--card:#272724;--tx:#F8F0E8;--mut:#B3ADA2;--line:#3B3A35;--accent-tx:#FF9A58;--ok:#A9D18E;--ok-soft:#2E3A28}
.status{display:flex;justify-content:space-between;padding:12px 28px 2px;font-weight:600;font-size:13px;flex:none}
.status span:last-child{display:flex;gap:5px;align-items:center}
.scr{flex:1;overflow-y:auto;padding:10px 18px 24px;scrollbar-width:none;min-height:0}
.scr::-webkit-scrollbar{display:none}
.enter{animation:rise .28s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:.35;transform:translateY(10px)}}

.tabbar{flex:none;display:flex;padding:8px 14px 16px;gap:4px;background:var(--bg);border-top:1px solid var(--line)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--mut);padding:6px 0;border-radius:14px;position:relative}
.tabbar button.on{color:var(--tx);background:var(--sand)}
.dark .tabbar button.on{background:var(--card)}
.pip{position:absolute;top:4px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 2px var(--bg)}

/* Básicos */
.hi{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.03em;line-height:1.02}
.mut{color:var(--mut)}
.small{font-size:12.5px}
.card{background:var(--card);border-radius:22px;padding:14px;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.sec{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.01em;margin:20px 0 10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:17px;background:var(--orange);color:var(--ink);font-weight:700;font-size:15.5px;padding:0 16px;transition:transform .12s,filter .12s}
.btn{text-align:center;line-height:1.2}.btn:hover{filter:brightness(1.05)}.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--tx);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ink{background:var(--ink);color:var(--cream)}
.dark .btn.ink{background:var(--cream);color:var(--ink)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{font-weight:600;text-decoration:underline;text-underline-offset:3px;font-size:13.5px;color:var(--accent-tx)}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:99px;font-weight:600;font-size:13px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);white-space:nowrap}
.chip.on{background:var(--ink);color:var(--cream);box-shadow:none}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--sand);white-space:nowrap}
.dark .pill{background:#35342f}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.hot{background:var(--orange);color:var(--ink)}
.pill.warn{background:#FBE0DC;color:#8C1D18}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600}
.field input{height:50px;border-radius:15px;border:1.5px solid var(--line);background:var(--card);padding:0 14px;font-size:16px;font-weight:500;width:100%}
.field input:focus{outline:none;border-color:var(--orange)}
.err{color:var(--red);font-size:13px;font-weight:600}
.dark .err{color:#FFB4AB}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* Plato de macros: el dato es la imagen */
.plate{position:relative;flex:none;display:grid;place-items:center}
.plate svg{position:absolute;inset:0;transform:rotate(-90deg)}
.plate b{font-family:var(--display);font-weight:800;line-height:1;letter-spacing:-.02em;text-align:center;position:relative}
.plate b small{display:block;font-family:var(--body);font-weight:600;font-size:.5em;letter-spacing:0;color:var(--mut);margin-top:1px}
.macros{display:flex;gap:10px;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.macros span{display:flex;align-items:center;gap:4px}
.macros i{width:8px;height:8px;border-radius:3px}
.dish{display:flex;gap:12px;align-items:center;width:100%;position:relative}
.dish .info{flex:1;min-width:0}
.dish h3{font-size:16px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.add{width:40px;height:40px;border-radius:14px;background:var(--orange);display:grid;place-items:center;color:var(--ink);flex:none;align-self:flex-end;transition:transform .12s}
.add:active{transform:scale(.9)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}

.todaystrip{display:block;width:100%;background:var(--ink);color:var(--cream);border-radius:22px;padding:14px 16px;margin-top:14px}
.todaystrip strong{font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.02em}
.mini{height:6px;border-radius:9px;background:#454440;margin-top:10px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--orange);border-radius:9px;transition:width .5s}

.cartbar{flex:none;margin:0 14px 10px;background:var(--ink);color:var(--cream);border-radius:18px;padding:0 16px;height:56px;display:flex;align-items:center;justify-content:space-between;font-weight:700;width:calc(100% - 28px)}
.cartbar b{color:var(--orange)}
.count{min-width:26px;height:26px;border-radius:9px;background:var(--orange);color:var(--ink);display:inline-grid;place-items:center;margin-right:10px;font-size:13px}

/* Barras */
.bar{display:block}
.bar .lbl{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:5px;font-variant-numeric:tabular-nums}
.track{height:12px;border-radius:9px;background:var(--sand);overflow:hidden;display:flex}
.track i{display:block;height:100%;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.track i.add-seg{opacity:.45}

/* Hoja inferior */
.scrim{position:absolute;inset:0;background:rgba(20,20,18,.5);z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--bg);border-radius:28px 28px 0 0;width:100%;max-height:90%;overflow-y:auto;padding:10px 18px 22px;scrollbar-width:none}
.anim.scrim{animation:fade .18s}
.anim .sheet{animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.3}}
.grab{width:42px;height:5px;background:var(--line);border-radius:9px;margin:0 auto 12px}
.close{width:36px;height:36px;border-radius:12px;background:var(--sand);display:grid;place-items:center;flex:none}
.dark .close{background:var(--card)}

/* Notificación */
.toast{position:absolute;left:12px;right:12px;top:38px;z-index:30;background:var(--ink);color:var(--cream);border-radius:18px;padding:11px 13px;display:flex;gap:10px;align-items:center;box-shadow:0 12px 28px rgba(0,0,0,.28);animation:drop .3s cubic-bezier(.2,.8,.2,1)}
.dark .toast{background:var(--cream);color:var(--ink)}
.toast .ic{width:34px;height:34px;border-radius:11px;background:var(--orange);color:var(--ink);display:grid;place-items:center;flex:none}
.toast b{display:block;font-size:13.5px;line-height:1.2}.toast span{font-size:12.5px;opacity:.8}
@keyframes drop{from{transform:translateY(-16px);opacity:0}}

/* Selección de opciones */
.opt{display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:16px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);width:100%}
.opt.on{box-shadow:inset 0 0 0 2px var(--ink)}
.radio{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--mut);flex:none}
.opt.on .radio{box-shadow:inset 0 0 0 6px var(--ink)}
.opt .grow{flex:1;min-width:0}
.opt b{display:block;font-size:14.5px;line-height:1.2}
.sum{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;font-variant-numeric:tabular-nums}
.sum.tot{font-family:var(--display);font-weight:800;font-size:21px;border-top:1.5px dashed var(--line);margin-top:7px;padding-top:9px}
.qty{display:flex;align-items:center;gap:8px;font-weight:700}
.qty button{width:30px;height:30px;border-radius:10px;background:var(--sand);display:grid;place-items:center}
.paying{position:absolute;inset:0;background:var(--orange);z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--ink);text-align:center;padding:30px}
.spin{width:44px;height:44px;border-radius:50%;border:5px solid rgba(34,34,32,.25);border-top-color:var(--ink);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* Pedido en vivo */
.eta{background:var(--orange);border-radius:26px;padding:16px 18px;color:var(--ink)}
.eta .big{font-family:var(--display);font-weight:800;font-size:40px;letter-spacing:-.03em;line-height:1}
.eta.done{background:var(--green);color:var(--cream)}
.map{border-radius:18px;overflow:hidden;margin-top:12px;background:#FFF3E7}
.steps{display:flex;flex-direction:column}
.st{display:grid;grid-template-columns:24px 1fr auto;gap:10px;padding-bottom:14px;position:relative;font-size:14px}
.st:last-child{padding-bottom:0}
.st .d{width:24px;height:24px;border-radius:50%;background:var(--sand);display:grid;place-items:center;color:var(--cream);z-index:1}
.st.on .d{background:var(--ink)}
.st.now .d{background:var(--orange);color:var(--ink);box-shadow:0 0 0 5px var(--orange-soft)}
.st:not(:last-child)::before{content:'';position:absolute;left:11px;top:22px;bottom:0;width:2px;background:var(--sand)}
.st.on:not(.now):not(:last-child)::before{background:var(--ink)}
.st:not(.on){color:var(--mut)}
.st.on{font-weight:600}
.code{display:flex;gap:7px;justify-content:center;margin-top:9px}
.code span{width:54px;height:64px;border-radius:16px;background:var(--ink);color:var(--cream);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:32px}
.avatar{width:46px;height:46px;border-radius:15px;background:var(--green);color:var(--cream);display:grid;place-items:center;font-family:var(--display);font-weight:800;flex:none}
.stars{display:flex;gap:4px;justify-content:center}
.stars button{color:#D9CCBB;padding:3px}
.stars button.on{color:var(--orange)}
.empty{text-align:center;padding:40px 14px;display:flex;flex-direction:column;align-items:center;gap:10px}
.emptyic{width:64px;height:64px;border-radius:22px;background:var(--sand);display:grid;place-items:center}
.dark .emptyic{background:var(--card)}

/* Repartidor */
.earn{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em;color:var(--ok);line-height:1;white-space:nowrap}
.switch{width:52px;height:30px;border-radius:99px;background:#4a4943;position:relative;transition:background .2s;flex:none}
.switch i{position:absolute;top:3px;left:3px;width:24px;height:24px;background:#fff;border-radius:50%;transition:left .2s}
.switch.on{background:#7FB765}.switch.on i{left:25px}
.route{display:grid;grid-template-columns:14px 1fr;gap:3px 8px;font-size:13.5px;font-weight:600;margin:10px 0 12px}
.route u{width:10px;height:10px;border-radius:50%;background:var(--orange);margin:5px 2px 0}
.route u.e{background:transparent;box-shadow:inset 0 0 0 2.5px var(--ok)}
.bignum{font-family:var(--display);font-weight:800;font-size:40px;letter-spacing:-.03em;line-height:1}
.split{display:flex;height:12px;border-radius:9px;overflow:hidden;margin:9px 0 6px}
.codein{height:68px!important;text-align:center;font-family:var(--display);font-size:32px!important;font-weight:800!important;letter-spacing:.35em;padding-left:.35em!important}
.prog{display:flex;gap:5px;margin-bottom:12px}
.prog i{height:6px;flex:1;border-radius:9px;background:var(--line)}
.prog i.on{background:var(--orange)}
.hero-a{background:var(--orange);color:var(--ink);margin:-10px -18px 0;padding:38px 22px 28px;border-radius:0 0 32px 32px}
.hero-a h1{font-size:43px;letter-spacing:-.035em;line-height:.96}
.wordmark{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.03em;margin-bottom:34px}

/* Responsive */
@media (max-width:1190px){
  body{overflow:hidden}
  .stage{display:flex;flex-direction:column;padding:0;gap:0;height:100dvh;justify-content:flex-start}
  .panel{display:none}
  .topbar{display:flex;flex:none;align-items:center;gap:14px;width:100%;padding:10px 18px;color:var(--cream)}
  .topbar .brand{font-size:20px}
  .topbar p{flex:1;font-size:13px;color:#E8E0D4;line-height:1.25;font-weight:500;min-width:0}
  .topbar .reset{flex:none}
  .phones{flex:1;min-height:0;align-items:center}
  .phone{height:calc(100dvh - 104px)}
  .rolebar{display:none}
}
@media (min-width:1191px){.rolebar{display:none}}
.rolebar{flex:none;gap:4px;background:#34332f;padding:4px;border-radius:14px;margin:0 12px 8px;width:calc(100% - 24px)}
.rolebar button{flex:1;text-align:center;padding:7px 4px;border-radius:11px;font-weight:700;font-size:13px;color:#CFC8BC;position:relative}
.rolebar button.on{background:var(--cream);color:var(--ink)}
.rolebar .pip{left:auto;right:10px;top:9px;box-shadow:none}
@media (max-width:820px){
  .phones{width:100%;gap:0}
  .slot{width:100%;height:100%}
  .slot>.who{display:none}
  .slot.hide{display:none}
  .phone{width:100%;height:100%;border-radius:22px 22px 0 0;box-shadow:none}
  .status{display:none}
  .scr{padding-top:16px}
  .rolebar{display:flex}
  .toast{top:12px}
  .topbar{padding:8px 14px}
  .topbar .brand{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="stage">
  <aside class="panel" id="panel"></aside>
  <div class="topbar" id="topbar"></div>
  <div class="rolebar" id="rolebar"></div>
  <div class="phones">
    <div class="slot" id="slot-c"><div class="who"><i></i>Estudiante que pide</div><div class="phone" id="c" data-side="c"></div></div>
    <div class="slot rr" id="slot-r"><div class="who"><i></i>Estudiante repartidor</div><div class="phone dark" id="r" data-side="r"></div></div>
  </div>
</div>

function totals(){const t={p:0,c:0,g:0,kcal:0};S.log.forEach(e=>{t.p+=e.p;t.c+=e.c;t.g+=e.g;t.kcal+=e.kcal});return t}

/* ========== Componentes ========== */
function plate(m,size=72,fs=17){
 const k=m.p*4+m.c*4+m.g*9||1,r=size/2-5,C=2*Math.PI*r,gap=2.5;let off=0;
 const seg=(v,col)=>{const len=(v/k)*C,out=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="9" stroke-dasharray="${Math.max(len-gap,0)} ${C}" stroke-dashoffset="${-off}"/>`;off+=len;return out};
 return `<div class="plate" style="width:${size}px;height:${size}px" role="img" aria-label="${num(kcalOf(m))} kilocalorías: ${m.p} gramos de proteína, ${m.c} de carbohidratos, ${m.g} de grasas"><svg width="${size}" height="${size}">${seg(m.p*4,MACRO.p.col)}${seg(m.c*4,MACRO.c.col)}${seg(m.g*9,MACRO.g.col)}</svg><b style="font-size:${fs}px">${num(m.kcal??kcalOf(m))}<small>kcal</small></b></div>`;
}
const macroRow=m=>`<div class="macros"><span><i style="background:${MACRO.p.col}"></i>P ${m.p}</span><span><i style="background:${MACRO.c.col}"></i>C ${m.c}</span><span><i style="background:${MACRO.g.col}"></i>G ${m.g}</span></div>`;
function bar(label,cur,goal,col,unit='g',add=0){
 const pc=Math.min(cur/goal*100,100),pa=Math.min(add/goal*100,100-pc);
 return `<div class="bar"><div class="lbl"><span>${label}</span><span>${num(cur)}${add?` <b style="color:var(--accent-tx)">+${num(add)}</b>`:''} <span class="mut">/ ${num(goal)} ${unit}</span></span></div>
 <div class="track" role="progressbar" aria-label="${label}" aria-valuenow="${Math.round(cur)}" aria-valuemin="0" aria-valuemax="${goal}"><i style="width:${pc}%;background:${col}"></i>${add?`<i class="add-seg" style="width:${pa}%;background:${col}"></i>`:''}</div></div>`;
}
const bars=(t,g,add={})=>`<div class="stack">${bar('Calorías',t.kcal,g.kcal,'var(--ink)','kcal',add.kcal||0)}${bar('Proteína',t.p,g.p,MACRO.p.col,'g',add.p||0)}${bar('Carbohidratos',t.c,g.c,MACRO.c.col,'g',add.c||0)}${bar('Grasas',t.g,g.g,MACRO.g.col,'g',add.g||0)}</div>`;
const statusbar=()=>`<div class="status"><span>${hhmm(S.min)}</span><span>${ic('bell',14)}</span></div>`;
const toastHtml=t=>t?`<div class="toast" role="status" data-key="${t.key}"><div class="ic">${ic(t.icon,18)}</div><div><b>${esc(t.title)}</b>${t.sub?`<span>${esc(t.sub)}</span>`:''}</div></div>`:'';
const sheetWrap=(inner,title)=>`<div class="scrim" data-a="closeSheet" data-self="1"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="grab"></div>${inner}</div></div>`;
const sheetHead=t=>`<div class="row between" style="margin-bottom:12px"><h2 style="font-size:23px">${t}</h2><button class="close" data-a="closeSheet" aria-label="Cerrar">${ic('x',18)}</button></div>`;
const stars=(val,act)=>`<div class="stars" role="group" aria-label="Calificación">${[1,2,3,4,5].map(n=>`<button class="${n<=val?'on':''}" data-a="${act}" data-n="${n}" aria-label="${n} de 5">${ic('star',30,true)}</button>`).join('')}</div>`;

/* ========== Pedir (menú) ========== */
function menuView(){
 const c=S.c,t=totals(),g=S.goal,left=Math.max(g.kcal-t.kcal,0),pLeft=Math.max(g.p-t.p,0);
 let list=DISHES.filter(d=>(c.rest==='all'||d.rest===c.rest)&&Object.keys(c.filters).every(k=>!c.filters[k]||FILTERS[k].f(d)));
 const fits=list.filter(d=>d.kcal<=left);
 const best=(fits.length?fits:[]).slice().sort((a,b)=>Math.min(b.p,pLeft)/b.kcal-Math.min(a.p,pLeft)/a.kcal)[0];
 if(best)list=[best,...list.filter(d=>d!==best)];
 return `<div class="hi">Hola, ${esc(S.auth.name)}.<br>¿Qué almuerzas hoy?</div>
 <button class="todaystrip" data-a="tab" data-t="day"><div class="row between"><div><strong>${num(left)} kcal</strong> <span style="font-size:13px">te faltan hoy</span></div><span class="small" style="font-weight:600">${num(pLeft)} g proteína</span></div><div class="mini"><i style="width:${Math.min(t.kcal/g.kcal*100,100)}%"></i></div></button>
 <div class="chips" style="margin-top:14px" role="group" aria-label="Filtros">${Object.entries(FILTERS).map(([k,f])=>`<button class="chip ${c.filters[k]?'on':''}" aria-pressed="${!!c.filters[k]}" data-a="filter" data-k="${k}">${f.t}</button>`).join('')}</div>
 <div class="chips" style="margin-top:8px" role="group" aria-label="Restaurantes"><button class="chip ${c.rest==='all'?'on':''}" data-a="rest" data-k="all">Todos</button>${Object.entries(RESTS).map(([k,n])=>`<button class="chip ${c.rest===k?'on':''}" data-a="rest" data-k="${k}">${n}</button>`).join('')}</div>
 <div class="stack" style="margin-top:14px">${list.length?list.map(d=>`<article class="card"><div class="dish"><button class="row" style="flex:1;min-width:0;gap:12px" data-a="ficha" data-id="${d.id}" aria-label="Ver ficha de ${esc(d.name)}">${plate(d)}<div class="info"><h3>${esc(d.name)}</h3><p class="small mut" style="margin:2px 0 6px">${RESTS[d.rest]} · <b style="color:var(--tx)">${money(d.price)}</b></p>${macroRow(d)}</div></button><button class="add" data-a="add" data-id="${d.id}" aria-label="Agregar ${esc(d.name)}">${ic('plus',20)}</button></div>${d===best?`<div class="tags"><span class="pill hot">${ic('target',12)} El que mejor encaja con tu día</span></div>`:''}</article>`).join(''):`<div class="empty"><div class="emptyic">${ic('filter',28)}</div><p style="font-weight:600">Ningún plato cumple todos los filtros</p><button class="link" data-a="clearFilters">Quitar filtros</button></div>`}</div><p class="small mut" style="margin-top:14px;text-align:center">Prototipo: platos, precios y macros son de ejemplo.</p>`;
}

 root.innerHTML=statusbar()+html+extra+tabbar+sheet+toastHtml(s.toast);
 const scr=root.querySelector('.scr');
 if(scr){scr.scrollTop=scroll;if(!sameKey)scr.classList.add('enter')}

 const scrim=root.querySelector('.scrim');
 if(scrim){if(hadSheet!==sheetId)scrim.classList.add('anim');else root.querySelector('.sheet').scrollTop=sheetScroll}
 views[side+'s']=sheetId;views[side]=key;
 if(focus){const el=document.getElementById(focus.id);if(el){el.focus();try{el.setSelectionRange(focus.pos,focus.pos)}catch(_){}}}

let mapPos=0;
function animateMap(){
 const path=document.getElementById('route'),dot=document.getElementById('dot'),o=myOrder();
 if(!path||!dot||!o)return;
 const len=path.getTotalLength(),to=MAP_POS[o.status],from=mapPos,start=performance.now();
 const place=f=>{const p=path.getPointAtLength(len*f);dot.setAttribute('cx',p.x);dot.setAttribute('cy',p.y)};
 place(from);
 if(from===to||matchMedia('(prefers-reduced-motion:reduce)').matches){place(to);mapPos=to;return}
 const step=t=>{if(!dot.isConnected){return}const k=Math.min((t-start)/1000,1),e=1-Math.pow(1-k,3);place(from+(to-from)*e);if(k<1)requestAnimationFrame(step);else mapPos=to};
 requestAnimationFrame(step);
}

 <div class="nexts" aria-live="polite"><small>Siguiente paso</small><p>${esc(hint)}</p></div>
 <div><p class="h-sm">Requerimientos en acción</p>${RFS.map(([n,t])=>`<div class="rf ${S.rfs[n]?'on':''}"><span class="box">${S.rfs[n]?ic('check',13):''}</span>RF${n}. ${t}</div>`).join('')}</div>
 <div class="logwrap"><p class="h-sm">Lo que pasa por dentro</p><div class="log">${S.events.map(e=>`<div><em class="${e.k==='BACK'?'b':e.k==='BD'?'d':''}">${e.k}</em><span>${esc(e.t)}</span></div>`).join('')}</div></div>
 <button class="reset" data-a="reset">Reiniciar demostración</button>`;
 document.getElementById('topbar').innerHTML=`<div class="brand">Campus<b>Bite</b></div><p aria-live="polite">${esc(hint)}</p><button class="reset" data-a="reset">Reiniciar</button>`;
 const o=myOrder(),rNeed=o&&['publicado','aceptado','recogido','camino'].includes(o.status);
 document.getElementById('rolebar').innerHTML=`<button class="${S.role==='c'?'on':''}" data-a="role" data-k="c">Pido</button><button class="${S.role==='r'?'on':''}" data-a="role" data-k="r">Reparto${rNeed&&S.role!=='r'?'<span class="pip"></span>':''}</button>`;
 document.getElementById('slot-c').classList.toggle('hide',S.role!=='c');
 document.getElementById('slot-r').classList.toggle('hide',S.role!=='r');
}
function render(){renderSide('c');renderSide('r');renderChrome()}

/* ========== Acciones ========== */
const A={
 authEmail(){const a=S.auth,e=a.email.trim();if(!/^[^\s@]+@(u\.)?icesi\.edu\.co$/i.test(e)){a.err='Usa tu correo institucional: termina en @u.icesi.edu.co o @icesi.edu.co.';return}a.err='';a.email=e;const f=e.split('@')[0].split(/[._-]/)[0];a.name=f.charAt(0).toUpperCase()+f.slice(1);a.step='code';ev('BACK',`Código de verificación enviado a ${e}.`)},
 authDemo(){const a=S.auth;a.email='mariana.gomez@u.icesi.edu.co';a.name='Mariana';a.err='';a.step='goal';ev('BD','Usuario de demostración con correo Icesi verificado.')},
 authBack(){S.auth.step='email';S.auth.err=''},
 authCode(){const a=S.auth;if(!/^\d{4}$/.test(a.code)){a.err='Escribe los 4 dígitos.';return}a.err='';a.step='goal';ev('BD','Correo verificado. Usuario creado.')},
 pickGoal({k}){S.goal={...GOALS[k]};S.auth.step=null;ev('BD',`Meta diaria guardada: ${num(S.goal.kcal)} kcal.`)},
 tab({t}){S.c.tab=t;S.c.view=null},
 rtab({t}){S.r.tab=t},
 role({k}){S.role=k},
 filter({k}){S.c.filters[k]=!S.c.filters[k];rf(3);if(S.c.filters[k])ev('BACK',`Menú filtrado: ${FILTERS[k].t.toLowerCase()}.`)},
 rest({k}){S.c.rest=k},
 clearFilters(){S.c.filters={};S.c.rest='all'},
 ficha({id}){S.c.sheet={type:'ficha',id};rf(3);ev('FRONT',`Ficha abierta: ${DISHES.find(d=>d.id===id).name}.`)},
 closeSheet(){S.c.sheet=null;S.r.sheet=null},
 add({id,close}){const c=S.c.cart,d=DISHES.find(x=>x.id===id);if(c.rest&&c.rest!==d.rest&&Object.keys(c.items).length){S.c.sheet={type:'swap',id};return}c.rest=d.rest;c.items[id]=(c.items[id]||0)+1;if(close)S.c.sheet=null},
 dec({id}){const c=S.c.cart;c.items[id]--;if(c.items[id]<=0)delete c.items[id];if(!Object.keys(c.items).length){c.rest=null;S.c.view=null}},
 swapCart({id}){const d=DISHES.find(x=>x.id===id);S.c.cart={rest:d.rest,items:{[id]:1}};S.c.sheet=null},
 goCheckout(){S.c.view='checkout'},
 backMenu(){S.c.view=null},
 setPoint({k}){S.c.point=k},setSlot({k}){S.c.slot=k},setPay({k}){S.c.pay=k},
 pay(){
  if(activeMine())return;
  S.c.paying=true;ev('FRONT',`Pagar con ${S.c.pay==='nequi'?'Nequi':'tarjeta'}.`);
  setTimeout(()=>{
   const c=S.c,s=cartSum(),sl=slot(c.slot),prev=myOrder();if(prev)prev.closed=true;
   const o={id:'A-'+(209+S.orders.length),mine:true,buyer:S.auth.name,rest:c.cart.rest,items:cartLines().map(({d,qty})=>({name:d.name,qty})),point:c.point,slot:c.slot,fee:sl.fee,total:s.price+sl.fee,status:'publicado',code:rnd4(),ts:{},macros:{p:s.p,c:s.c,g:s.g,kcal:s.kcal},names:cartLines().map(({d,qty})=>(qty>1?qty+' × ':'')+d.name).join(', ')};
   S.orders.unshift(o);c.cart={rest:null,items:{}};c.view=null;c.tab='order';c.paying=false;mapPos=0;
   tick(1);rf(2);
   ev('BACK',`Pago aprobado (${money(o.total)}). Solo ahora se publica a repartidores y se reservan ${money(earnOf(o))}.`);
   ev('BD',`Pago y pedido ${o.id} guardados. Código de entrega generado.`);
   if(S.r.online)toast('r','bike','Nuevo pedido pagado',`${RESTS[o.rest]} → ${point(o.point).t} · ganas ${money(earnOf(o))}`);
   render();
  },1100);
 },
 accept({id}){const o=S.orders.find(x=>x.id===id);if(S.r.activeId||o.status!=='publicado')return;S.r.activeId=id;S.r.code='';S.r.err='';setStatus(o,'aceptado',3)},
 advance({s}){setStatus(S.orders.find(o=>o.id===S.r.activeId),s,s==='recogido'?6:2)},
 finish(){
  const o=S.orders.find(x=>x.id===S.r.activeId),r=S.r;
  if(r.code.trim()!==o.code){r.err='Ese código no coincide. Pídelo de nuevo: sin él no se cierra la entrega.';ev('BACK','Código incorrecto. La entrega sigue abierta.');return}
  const e=earnOf(o);r.err='';r.code='';setStatus(o,'entregado',4);r.activeId=null;r.balance+=e;r.trips++;r.hist.unshift({t:`${RESTS[o.rest]} → ${point(o.point).t}`,amt:e,time:o.ts.entregado});r.sheet={id:o.id};rf(1);
  ev('BACK',`Código correcto. Entrega cerrada y ${money(e)} liberados al repartidor.`);
  if(o.mine){const m=o.macros;S.log.unshift({id:Date.now(),name:o.names,p:m.p,c:m.c,g:m.g,kcal:m.kcal,src:'Pedido',time:o.ts.entregado});rf(4);ev('BD',`Registro de Mi día: +${num(m.kcal)} kcal, P ${m.p}, C ${m.c}, G ${m.g}.`);toast('c','check','Tu pedido llegó',`Sumamos ${num(m.kcal)} kcal a tu día`)}
 },
 toggleOnline(){S.r.online=!S.r.online},
 withdraw(){const a=S.r.balance;S.r.balance=0;S.r.hist.unshift({t:`Retiro a Nequi (simulado)`,amt:-a,time:hhmm(S.min)});toast('r','wallet','Retiro enviado',`${money(a)} a tu Nequi`);ev('BACK',`Retiro simulado de ${money(a)}.`)},
 rateCourier({n}){const o=myOrder();o.rated=+n;ev('BD',`Reseña del repartidor: ${n} de 5.`)},
 rateBuyer({n}){const o=S.orders.find(x=>x.id===S.r.sheet.id);S.r.sheet=null;toast('r','star','Gracias por calificar','Las reseñas cuidan a la comunidad');ev('BD',`Reseña de ${o.buyer}: ${n} de 5.`)},
 newOrder(){const o=myOrder();if(o)o.closed=true;S.c.tab='menu'},
 goalSheet(){const g=S.goal;S.c.form={kcal:g.kcal,p:g.p,c:g.c,g:g.g};S.c.sheet={type:'goal'}},
 goalPreset({k}){const g=GOALS[k];S.c.form={kcal:g.kcal,p:g.p,c:g.c,g:g.g,label:g.label}},
 saveGoal(){const f=S.c.form,v=['kcal','p','c','g'].map(k=>parseInt(f[k],10));if(v.some(x=>!(x>0))){f.err='Todos los valores deben ser números mayores que 0.';return}const preset=Object.values(GOALS).find(x=>x.kcal===v[0]&&x.p===v[1]&&x.c===v[2]&&x.g===v[3]);S.goal={label:preset?preset.label:'Meta personalizada',kcal:v[0],p:v[1],c:v[2],g:v[3]};S.c.sheet=null;rf(4);ev('BD',`Meta diaria actualizada: ${num(v[0])} kcal.`)},
 mealSheet(){S.c.form={};S.c.sheet={type:'meal'}},
 quickMeal({i}){S.c.form={...QUICK[+i]}},
 saveMeal(){const f=S.c.form,name=(f.name||'').trim(),m={p:Math.max(parseInt(f.p,10)||0,0),c:Math.max(parseInt(f.c,10)||0,0),g:Math.max(parseInt(f.g,10)||0,0)};if(!name){f.err='Escribe qué comiste.';return}if(!kcalOf(m)){f.err='Agrega al menos un macro.';return}S.log.unshift({id:Date.now(),name,...m,kcal:kcalOf(m),src:'Manual',time:hhmm(S.min)});S.c.sheet=null;rf(4);ev('BD',`Comida manual registrada: ${name}.`)},
 reset(){Object.keys(views).forEach(k=>delete views[k]);mapPos=0;const role=S.role;init();S.role=role},
};
function setStatus(o,st,mins){
 o.status=st;o.ts[st]=tick(mins);
 const msg={aceptado:['Aceptado',`${COURIER.name} tomó tu pedido`,'bike'],recogido:['Recogido','Ya tiene tu comida','bag'],camino:['En camino',`Va hacia ${point(o.point).t}. Ten tu código listo`,'pin']}[st];
 ev('BACK',`Pedido ${o.id}: estado "${st==='camino'?'en camino':st}". ${ETA[st]?`Tiempo estimado: ${ETA[st]} min.`:''}`);
 ev('BD',`Historial de estados: ${st==='camino'?'en camino':st}, ${o.ts[st]}.`);
 if(o.mine){rf(5);if(msg)toast('c',msg[2],msg[0],msg[1])}
}
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-a]');if(!el||el.disabled)return;
 if(el.dataset.self&&e.target!==el)return;
 const fn=A[el.dataset.a];if(!fn)return;
 fn({...el.dataset});render();
});
document.addEventListener('input',e=>{
 const b=e.target.dataset.bind;if(!b)return;
 let v=e.target.value;if(e.target.classList.contains('codein')){v=v.replace(/\D/g,'').slice(0,4);e.target.value=v}
 const path=b.split('.');let o=S;path.slice(0,-1).forEach(k=>o=o[k]);o[path[path.length-1]]=v;
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&(S.c.sheet||S.r.sheet)){S.c.sheet=null;S.r.sheet=null;render()}
 if(e.key==='Enter'&&e.target.tagName==='INPUT'){
  const m={'f-email':'authEmail','f-acode':'authCode','r-code':'finish'}[e.target.id];
  if(m){A[m]();render()}
 }
});
init();render();
</script>
</body>
</html>
